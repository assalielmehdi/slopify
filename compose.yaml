services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      API_CONTAINER_MODE: 'true'
      API_HOST: '0.0.0.0'
      API_PORT: '3001'
      API_SHUTDOWN_GRACE_MS: '${API_SHUTDOWN_GRACE_MS:-10000}'
      CLICKUP_API_BASE_URL: '${CLICKUP_API_BASE_URL:-}'
      CLICKUP_API_TOKEN: '${CLICKUP_API_TOKEN:-}'
      DATABASE_PATH: '${DATABASE_PATH:-/var/lib/workbench/workbench.sqlite}'
      GITLAB_HOST: '${GITLAB_HOST:-https://gitlab.com}'
      GITLAB_TOKEN: '${GITLAB_TOKEN:-}'
      MODEL_PROVIDER_API_KEY: '${MODEL_PROVIDER_API_KEY:-}'
      WORKSPACE_ROOT: '/workspace'
    expose:
      - '3001'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/healthz',{signal:AbortSignal.timeout(2000)}).then(response=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks:
      - application
    stop_grace_period: 20s
    volumes:
      - type: volume
        source: workbench-data
        target: /var/lib/workbench
      - type: bind
        source: '${WORKSPACE_HOST_PATH:-./workspace}'
        target: /workspace
        bind:
          create_host_path: false

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_INTERNAL_URL: 'http://api:3001'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz',{signal:AbortSignal.timeout(2000)}).then(response=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks:
      - application
    ports:
      - '${APP_HOST:-127.0.0.1}:${APP_PORT:-3000}:3000'

networks:
  application:
    driver: bridge

volumes:
  workbench-data:
